# This workflow deploys the site to Netlify twice a day.
# It uses the Netlify CLI to push files directly to Netlify's CDN,
# bypassing Netlify's build system entirely so 0 credits are used.
# Netlify builds are set to "Stopped" in Netlify settings.
# To manually deploy anytime, go to Actions tab and click "Run workflow".

name: Scheduled Netlify Deploy
on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Netlify
        run: npx netlify-cli deploy --dir=. --prod
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
